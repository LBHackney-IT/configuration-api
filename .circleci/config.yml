version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.12
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  terraform-init-then-apply:
    description: "Initializes and applies terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve
  terraform-init-then-destroy:
    description: "Initializes and destroys terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: destroy
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform destroy -auto-approve
  terraform-preview:
    description: "Gives a preview for Terraform configuration changes."
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
            terraform plan
          name: terraform preview
  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Build lambda
          command: |
            cd ./ConfigurationApi/
            chmod +x ./build.sh
            ./build.sh
      - run:
          name: Deploy lambda
          command: |
            cd ./ConfigurationApi/
            npm i serverless-associate-waf
            npm i @serverless/safeguards-plugin --save-dev
            sls deploy --stage <<parameters.stage>> --conceal
  remove-lambda:
    description: "Removes the API Serverless stack"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y awscli nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Remove lambda
          command: |
            cd ./ConfigurationApi/
            npm i serverless-associate-waf
            npm i @serverless/safeguards-plugin --save-dev
            if aws cloudformation describe-stacks \
              --stack-name configuration-api-<<parameters.stage>> \
              --region eu-west-2 >/dev/null 2>/tmp/cloudformation-error; then
              sls remove --stage <<parameters.stage>> --conceal
            else
              error=$(</tmp/cloudformation-error)
              case "$error" in
                *does\ not\ exist*)
                  echo "Serverless stack configuration-api-<<parameters.stage>> is already removed."
                  ;;
                *)
                  printf '%s\n' "$error" >&2
                  exit 1
                  ;;
              esac
            fi

jobs:
  check-code-formatting:
    executor: docker-dotnet
    steps:
      - checkout
      - run:
          name: Install dotnet format
          command: dotnet tool install dotnet-format --tool-path ./dotnet-format-local/
      - run:
          name: Run formatter check
          command: ./dotnet-format-local/dotnet-format --check
  build-and-test:
    executor: docker-python
    steps:
      - checkout:
          method: full
      - setup_remote_docker
      - run:
          name: build
          command: docker compose build configuration-api-test
      - run:
          name: Run tests
          command: docker compose run configuration-api-test
      - run:
          name: Prepare the report
          command: |
            mkdir coverage
            docker cp $(docker ps -aqf "name=configuration-api-test"):/app/coverage ./
            sed -i "s|/app/|$(pwd)/|g" coverage/*/coverage.opencover.xml
      - sonarcloud/scan
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT
  assume-role-staging:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  terraform-init-and-apply-to-development:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "development"
  terraform-init-and-apply-to-staging:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "staging"
  terraform-init-and-apply-to-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-apply:
          environment: "production"
  preview-development-terraform:
    executor: docker-terraform
    steps:
      - terraform-preview:
          environment: "development"
  preview-staging-terraform:
    executor: docker-terraform
    steps:
      - terraform-preview:
          environment: "staging"
  preview-production-terraform:
    executor: docker-terraform
    steps:
      - terraform-preview:
          environment: "production"
  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "development"
  deploy-to-staging:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "staging"
  deploy-to-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "production"
  assume-role-pre-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRE_PRODUCTION
  remove-pre-production-lambda:
    executor: docker-dotnet
    steps:
      - remove-lambda:
          stage: "pre-production"
  terraform-init-and-destroy-pre-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-destroy:
          environment: "pre-production"

workflows:
  feature:
    jobs:
      - check-code-formatting:
          context: api-nuget-token-context
          filters:
            branches:
              ignore:
                - master
                - release
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              ignore:
                - master
                - release
      - assume-role-development:
          context: api-assume-role-housing-development-context
          filters:
            branches:
              ignore:
                - master
                - release
      - preview-development-terraform:
          requires:
            - assume-role-development
      - assume-role-staging:
          context: api-assume-role-housing-staging-context
          filters:
            branches:
              ignore:
                - master
                - release
      - preview-staging-terraform:
          requires:
            - assume-role-staging
      - assume-role-production:
          context: api-assume-role-housing-production-context
          filters:
            branches:
              ignore:
                - master
                - release
      - preview-production-terraform:
          requires:
            - assume-role-production
  development:
    jobs:
      - check-code-formatting:
          context: api-nuget-token-context
          filters:
            branches:
              only: master
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              only: master
      - assume-role-development:
          context: api-assume-role-housing-development-context
          requires:
            - build-and-test
          filters:
            branches:
              only: master
      - terraform-init-and-apply-to-development:
          requires:
            - assume-role-development
          filters:
            branches:
              only: master
      - deploy-to-development:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-init-and-apply-to-development
          filters:
            branches:
              only: master
  staging-and-production:
      jobs:
      - check-code-formatting:
          context: api-nuget-token-context
          filters:
            branches:
              only: release
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              only: release
      - assume-role-staging:
          context: api-assume-role-housing-staging-context
          requires:
              - build-and-test
          filters:
             branches:
               only: release
      - terraform-init-and-apply-to-staging:
          requires:
            - assume-role-staging
          filters:
            branches:
              only: release
      - deploy-to-staging:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-init-and-apply-to-staging
          filters:
            branches:
              only: release
      - permit-production-terraform-release:
          type: approval
          requires:
            - deploy-to-staging
      - assume-role-production:
          context: api-assume-role-housing-production-context
          requires:
              - permit-production-terraform-release
          filters:
             branches:
               only: release
      - terraform-init-and-apply-to-production:
          requires:
            - assume-role-production
          filters:
            branches:
              only: release
      - permit-production-release:
          type: approval
          requires:
            - terraform-init-and-apply-to-production
          filters:
            branches:
              only: release
      - deploy-to-production:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - permit-production-release
          filters:
            branches:
              only: release

  teardown-pre-production:
    jobs:
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          filters:
            branches:
              only: master
      - remove-pre-production-lambda:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: master
      - terraform-init-and-destroy-pre-production:
          requires:
            - remove-pre-production-lambda
          filters:
            branches:
              only: master
